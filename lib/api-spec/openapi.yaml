openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: portal
    description: Public VIP Hub data
  - name: auth
    description: Account authentication and session operations
  - name: vip
    description: VIP payment and status operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gateway:
    get:
      operationId: getGateway
      tags: [portal]
      summary: Get the public player gateway
      responses:
        "200":
          description: Gateway data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gateway"
  /vip:
    get:
      operationId: getVipHub
      tags: [portal]
      summary: Get the free public VIP Hub
      responses:
        "200":
          description: VIP Hub data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gateway"
  /bio:
    get:
      operationId: getBioTool
      tags: [portal]
      summary: Get the free Bio Tool
      responses:
        "200":
          description: Bio Tool data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerTool"
  /live-status:
    get:
      operationId: getLiveStatus
      tags: [portal]
      summary: Check live partner tool availability
      description: Probes every registered partner tool from the API server and returns the latest status and latency.
      responses:
        "200":
          description: Live partner tool status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStatusResponse"
  /activity:
    get:
      operationId: getActivity
      tags: [portal]
      summary: Get recent public activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "200":
          description: Account created and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with existing credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "200":
          description: Signed in and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Session ended
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current session user with verified VIP status
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /heartbeat:
    post:
      operationId: heartbeat
      tags: [auth]
      summary: Update last-seen for the active session
      responses:
        "200":
          description: Last seen updated
  /vip/payment:
    post:
      operationId: createVipPayment
      tags: [vip]
      summary: Create a one-time INR 20 VIP payment request
      responses:
        "200":
          description: Payment link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipPaymentInit"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: VIP already unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /vip/status:
    get:
      operationId: getVipStatus
      tags: [vip]
      summary: Server-verified VIP status for the current session
      responses:
        "200":
          description: Verified VIP status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipStatus"
  /webhook/instamojo:
    post:
      operationId: instamojoWebhook
      tags: [vip]
      summary: Instamojo payment webhook receiver (server-side verification only)
      responses:
        "200":
          description: Webhook processed
        "400":
          description: Verification failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserProfile:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        joinedAt:
          type: string
        activityCount:
          type: number
        vipAccess:
          type: boolean
      required: [id, displayName, joinedAt, activityCount, vipAccess]
    PartnerTool:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [online, checking, warning, offline]
        category:
          type: string
        isFree:
          type: boolean
      required: [id, name, url, description, status, category, isFree]
    LiveToolStatus:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        status:
          type: string
          enum: [online, checking, warning, offline]
        latencyMs:
          type: number
        detail:
          type: string
      required: [id, name, url, status, latencyMs, detail]
    LiveStatusResponse:
      type: object
      properties:
        checkedAt:
          type: string
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/LiveToolStatus"
      required: [checkedAt, statuses]
    ActivityLog:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        detail:
          type: string
        createdAt:
          type: string
      required: [id, action, detail, createdAt]
    AuthInput:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
        password:
          type: string
          minLength: 6
          maxLength: 128
      required: [username, password]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
      required: [user]
    SessionUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        joinedAt:
          type: string
        vipAccess:
          type: boolean
        online:
          type: boolean
        lastSeenAt:
          type: string
        activityCount:
          type: number
      required: [id, username, displayName, joinedAt, vipAccess, online, activityCount]
    VipStatus:
      type: object
      properties:
        vipAccess:
          type: boolean
        verifiedAt:
          type: string
      required: [vipAccess, verifiedAt]
    VipPaymentInit:
      type: object
      properties:
        paymentUrl:
          type: string
        paymentRequestId:
          type: string
        amount:
          type: number
        currency:
          type: string
      required: [paymentUrl, paymentRequestId, amount, currency]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    GatewayStats:
      type: object
      properties:
        totalTools:
          type: number
        onlineTools:
          type: number
        activeSessions:
          type: number
      required: [totalTools, onlineTools, activeSessions]
    Gateway:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        stats:
          $ref: "#/components/schemas/GatewayStats"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/PartnerTool"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityLog"
      required: [user, stats, tools, recentActivity]

